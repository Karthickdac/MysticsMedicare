          type: array
          items: { $ref: "#/components/schemas/CategoryValue" }
    SeriesPoint:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: number }
    CategoryValue:
      type: object
      required: [name, value]
