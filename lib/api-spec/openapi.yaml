openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: MediCare HMS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: dashboard
  - name: patients
  - name: appointments
  - name: encounters
  - name: beds
  - name: admissions
  - name: ipd
  - name: lab
  - name: prescriptions
  - name: pharmacy
  - name: billing
  - name: inventory
  - name: staff
  - name: vitals
  - name: radiology
  - name: ot
  - name: vaccinations
  - name: consent
  - name: checkups
  - name: roster
  - name: queue
  - name: videos
  - name: notifications
  - name: templates
  - name: audit
  - name: Storage
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "204": { description: Logged out }
  /auth/me:
    get:
      operationId: me
      tags: [auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }

  /dashboard/summary:
