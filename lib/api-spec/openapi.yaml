components:
  schemas:
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1 }
        size: { type: integer, minimum: 1 }
        contentType: { type: string, minLength: 1 }
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { type: string }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    Session:
      type: object
      required: [id, email, name, role]
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        role: { type: string }
        staffId: { type: ["string", "null"] }

    DashboardSummary:
      type: object
      required: [totalPatients, todayAppointments, occupiedBeds, totalBeds, pendingLabOrders, pendingPrescriptions, revenueToday, revenueMonth, criticalAlerts]
      properties:
        totalPatients: { type: integer }
        todayAppointments: { type: integer }
        occupiedBeds: { type: integer }
        totalBeds: { type: integer }
        pendingLabOrders: { type: integer }
        pendingPrescriptions: { type: integer }
        revenueToday: { type: number }
        revenueMonth: { type: number }
        criticalAlerts: { type: integer }
    ActivityItem:
      type: object
      required: [id, type, title, description, createdAt]
      properties:
        id: { type: integer }
        type: { type: string }
        title: { type: string }
        description: { type: string }
        patientName: { type: ["string", "null"] }
        createdAt: { type: string }
    DashboardCharts:
      type: object
      required: [patientTrend, revenueTrend, departmentBreakdown, bedOccupancy]
      properties:
