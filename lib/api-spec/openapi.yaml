      operationId: getOpdQueueStats
      tags: [queue]
      responses:
        "200":
          description: Live queue stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueueStats" }
  /queue/opd/{id}/{action}:
    post:
      operationId: tokenAction
      tags: [queue]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - in: path
          name: action
          required: true
          schema: { type: string, enum: [call, recall, skip, complete] }
      responses:
        "200":
          description: Token updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueueToken" }
  /queue/opd/next:
    post:
      operationId: callNextToken
      tags: [queue]
      responses:
        "200":
          description: Next token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueueToken" }

  /videos:
    get:
      operationId: listVideos
      tags: [videos]
      parameters:
        - { in: query, name: patientId, schema: { type: integer } }
        - { in: query, name: encounterId, schema: { type: integer } }
        - { in: query, name: type, schema: { type: string } }
      responses:
        "200":
          description: Videos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VideoRecording" }
    post:
      operationId: createVideo
      tags: [videos]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoRecordingInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoRecording" }
  /videos/{id}:
    get:
      operationId: getVideo
      tags: [videos]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Video
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoRecording" }
    delete:
      operationId: deleteVideo
      tags: [videos]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }

  /notifications/templates:
    get:
      operationId: listNotificationTemplates
      tags: [templates]
      parameters:
        - { in: query, name: eventKey, schema: { type: string } }
        - { in: query, name: channel, schema: { type: string } }
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NotificationTemplate" }
    post:
      operationId: createNotificationTemplate
      tags: [templates]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationTemplateInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationTemplate" }
  /notifications/templates/{id}:
    get:
      operationId: getNotificationTemplate
      tags: [templates]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationTemplate" }
    patch:
      operationId: updateNotificationTemplate
      tags: [templates]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationTemplateUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationTemplate" }
    delete:
      operationId: deleteNotificationTemplate
      tags: [templates]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
  /notifications/templates/preview:
    post:
      operationId: previewNotificationTemplate
      tags: [templates]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplatePreviewInput" }
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplatePreview" }

  /notifications/send:
    post:
      operationId: sendNotification
      tags: [notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendNotificationInput" }
      responses:
        "201":
          description: Sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationLog" }
  /notifications/log:
    get:
      operationId: listNotificationLog
      tags: [notifications]
      parameters:
        - { in: query, name: patientId, schema: { type: integer } }
        - { in: query, name: eventKey, schema: { type: string } }
        - { in: query, name: channel, schema: { type: string } }
        - { in: query, name: status, schema: { type: string } }
      responses:
        "200":
          description: Log
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NotificationLog" }
  /notifications/events:
    get:
      operationId: listNotificationEvents
      tags: [notifications]
      responses:
        "200":
          description: Event types
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NotificationEvent" }

  /audit:
    get:
      operationId: listAuditLog
      tags: [audit]
      parameters:
        - { in: query, name: userId, schema: { type: integer } }
        - { in: query, name: entity, schema: { type: string } }
      responses:
        "200":
          description: Audit log
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadUrlRequest" }
      responses:
        "200":
          description: Presigned URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadUrlResponse" }
        "400":
          description: Bad request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500":
          description: Server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      parameters:
        - { in: path, name: filePath, required: true, schema: { type: string } }
      responses:
        "200":
          description: Object
          content:
            "*/*":
              schema: { type: string, format: binary }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      parameters:
        - { in: path, name: objectPath, required: true, schema: { type: string } }
      responses:
        "200":
          description: Object
          content:
            "*/*":
              schema: { type: string, format: binary }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

components:
  schemas:
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1 }
        size: { type: integer, minimum: 1 }
        contentType: { type: string, minLength: 1 }
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { type: string }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    Session:
      type: object
      required: [id, email, name, role]
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        role: { type: string }
        staffId: { type: ["string", "null"] }

    DashboardSummary:
      type: object
      required: [totalPatients, todayAppointments, occupiedBeds, totalBeds, pendingLabOrders, pendingPrescriptions, revenueToday, revenueMonth, criticalAlerts]
      properties:
        totalPatients: { type: integer }
        todayAppointments: { type: integer }
        occupiedBeds: { type: integer }
        totalBeds: { type: integer }
        pendingLabOrders: { type: integer }
        pendingPrescriptions: { type: integer }
        revenueToday: { type: number }
        revenueMonth: { type: number }
        criticalAlerts: { type: integer }
    ActivityItem:
      type: object
      required: [id, type, title, description, createdAt]
      properties:
        id: { type: integer }
        type: { type: string }
        title: { type: string }
        description: { type: string }
        patientName: { type: ["string", "null"] }
        createdAt: { type: string }
    DashboardCharts:
      type: object
      required: [patientTrend, revenueTrend, departmentBreakdown, bedOccupancy]
      properties:
        patientTrend:
          type: array
          items: { $ref: "#/components/schemas/SeriesPoint" }
        revenueTrend:
          type: array
          items: { $ref: "#/components/schemas/SeriesPoint" }
        departmentBreakdown:
          type: array
          items: { $ref: "#/components/schemas/CategoryValue" }
        bedOccupancy:
          type: array
          items: { $ref: "#/components/schemas/CategoryValue" }
    SeriesPoint:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: number }
    CategoryValue:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        value: { type: number }

    Patient:
      type: object
      required: [id, uhid, name, gender, dob, phone, createdAt]
      properties:
        id: { type: integer }
        uhid: { type: string }
        name: { type: string }
        gender: { type: string }
        dob: { type: string }
        age: { type: integer }
        phone: { type: string }
        email: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        bloodGroup: { type: ["string", "null"] }
        allergies: { type: ["string", "null"] }
        emergencyContact: { type: ["string", "null"] }
        insuranceProvider: { type: ["string", "null"] }
        insuranceNumber: { type: ["string", "null"] }
        avatarUrl: { type: ["string", "null"] }
        createdAt: { type: string }
    PatientInput:
      type: object
      required: [name, gender, dob, phone]
      properties:
        name: { type: string }
        gender: { type: string }
        dob: { type: string }
        phone: { type: string }
        email: { type: string }
        address: { type: string }
        bloodGroup: { type: string }
        allergies: { type: string }
        emergencyContact: { type: string }
        insuranceProvider: { type: string }
        insuranceNumber: { type: string }
    PatientUpdate:
      type: object
      properties:
        name: { type: string }
        gender: { type: string }
        dob: { type: string }
        phone: { type: string }
        email: { type: string }
        address: { type: string }
        bloodGroup: { type: string }
        allergies: { type: string }
        emergencyContact: { type: string }
        insuranceProvider: { type: string }
        insuranceNumber: { type: string }

    Appointment:
      type: object
      required: [id, patientId, patientName, doctorId, doctorName, department, scheduledAt, status, createdAt]
      properties:
        id: { type: integer }
        patientId: { type: integer }
        patientName: { type: string }
        doctorId: { type: integer }
        doctorName: { type: string }
        department: { type: string }
        scheduledAt: { type: string }
        status: { type: string }
        reason: { type: ["string", "null"] }
        tokenNumber: { type: ["integer", "null"] }
        createdAt: { type: string }
    AppointmentInput:
      type: object
      required: [patientId, doctorId, department, scheduledAt]
      properties:
        patientId: { type: integer }
        doctorId: { type: integer }
        department: { type: string }
        scheduledAt: { type: string }
        reason: { type: string }
    AppointmentUpdate:
      type: object
      properties:
        scheduledAt: { type: string }
        status: { type: string }
        reason: { type: string }

    Encounter:
      type: object
      required: [id, patientId, patientName, type, doctorId, doctorName, status, startedAt, createdAt]
      properties:
        id: { type: integer }
        patientId: { type: integer }
        patientName: { type: string }
        type: { type: string }
        doctorId: { type: integer }
        doctorName: { type: string }
        status: { type: string }
        chiefComplaint: { type: ["string", "null"] }
        diagnosis: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        bedId: { type: ["integer", "null"] }
        startedAt: { type: string }
        endedAt: { type: ["string", "null"] }
        createdAt: { type: string }
    EncounterInput:
      type: object
      required: [patientId, type, doctorId]
      properties:
        patientId: { type: integer }
        type: { type: string }
        doctorId: { type: integer }
        chiefComplaint: { type: string }
        diagnosis: { type: string }
        notes: { type: string }
        bedId: { type: integer }
    EncounterUpdate:
      type: object
      properties:
        status: { type: string }
        chiefComplaint: { type: string }
        diagnosis: { type: string }
        notes: { type: string }
        endedAt: { type: string }

    Bed:
      type: object
      required: [id, code, ward, status, createdAt]
      properties:
        id: { type: integer }
        code: { type: string }
        ward: { type: string }
        status: { type: string }
        patientId: { type: ["integer", "null"] }
        patientName: { type: ["string", "null"] }
        admittedAt: { type: ["string", "null"] }
        createdAt: { type: string }
    BedInput:
      type: object
      required: [code, ward]
      properties:
        code: { type: string }
        ward: { type: string }
        floor: { type: ["string", "null"] }
        bedType: { type: ["string", "null"] }
        genderPolicy: { type: ["string", "null"], enum: [male, female, any, null] }
        ageMinYears: { type: ["integer", "null"] }
        ageMaxYears: { type: ["integer", "null"] }
        dailyRate: { type: ["string", "null"] }
    BedAssignmentInput:
      type: object
      required: [patientId]
      properties:
        patientId: { type: integer }
    BedStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [available, cleaning, maintenance]

    Admission:
      type: object
      required: [id, patientId, doctorId, ward, status, advanceAmount, admittedAt, createdAt]
      properties:
        id: { type: integer }
        patientId: { type: integer }
        patientName: { type: ["string", "null"] }
        encounterId: { type: ["integer", "null"] }
        doctorId: { type: integer }
        doctorName: { type: ["string", "null"] }
        bedId: { type: ["integer", "null"] }
        bedCode: { type: ["string", "null"] }
        ward: { type: string }
        reason: { type: ["string", "null"] }
        status: { type: string }
        advanceAmount: { type: string }
        summary: { type: ["string", "null"] }
        admittedAt: { type: string }
        dischargedAt: { type: ["string", "null"] }
        createdAt: { type: string }
    AdmissionDischarge:
      allOf:
        - $ref: "#/components/schemas/Admission"
        - type: object
          properties:
            summaryUrl: { type: ["string", "null"] }
    AdmissionInput:
      type: object
      required: [patientId, doctorId, bedId]
      properties:
        patientId: { type: integer }
        doctorId: { type: integer }
        bedId: { type: integer }
        reason: { type: string }
        advanceAmount: { type: number }
    AdmissionTransferInput:
      type: object
      required: [toBedId]
      properties:
        toBedId: { type: integer }
        reason: { type: string }
    AdmissionDischargeInput:
      type: object
      properties:
        summary: { type: string }

    WardRound:
      type: object
      required: [id, admissionId, note, createdAt]
      properties:
        id: { type: integer }
        admissionId: { type: integer }
        doctorId: { type: ["integer", "null"] }
        doctorName: { type: ["string", "null"] }
        note: { type: string }
        signedBy: { type: ["string", "null"] }
        createdAt: { type: string }
    WardRoundInput:
      type: object
      required: [note]
      properties:
        note: { type: string }
        doctorId: { type: integer }

    NursingNote:
      type: object
      required: [id, admissionId, category, note, createdAt]
      properties:
        id: { type: integer }
        admissionId: { type: integer }
        nurseId: { type: ["integer", "null"] }
        nurseName: { type: ["string", "null"] }
        category: { type: string }
        note: { type: string }
        createdAt: { type: string }
    NursingNoteInput:
      type: object
      required: [note]
      properties:
        note: { type: string }
        category: { type: string }
        nurseId: { type: integer }

    MarEntry:
      type: object
      required: [prescriptionId, drug, dosage, scheduledAt, status]
      properties:
        id: { type: ["integer", "null"] }
        prescriptionId: { type: integer }
        drug: { type: string }
        dosage: { type: string }
        frequency: { type: ["string", "null"] }
        scheduledAt: { type: string }
        status: { type: string }
        administeredBy: { type: ["string", "null"] }
        administeredAt: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
    MarDoseInput:
      type: object
      required: [prescriptionId, scheduledAt, status]
      properties:
        prescriptionId: { type: integer }
        scheduledAt: { type: string }
        status:
          type: string
          enum: [given, held, refused]
        notes: { type: string }

    IpdCensusWard:
      type: object
      required: [ward, total, occupied]
      properties:
        ward: { type: string }
        total: { type: integer }
        occupied: { type: integer }
    IpdCensus:
      type: object
      required: [totalBeds, occupied, available, cleaning, occupancyRate, activeAdmissions, avgLengthOfStayDays, wards]
      properties:
        totalBeds: { type: integer }
        occupied: { type: integer }
        available: { type: integer }
        cleaning: { type: integer }
        occupancyRate: { type: number }
        activeAdmissions: { type: integer }
        avgLengthOfStayDays: { type: number }
        wards:
          type: array
          items: { $ref: "#/components/schemas/IpdCensusWard" }

    LabResultParam:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        value: { type: string }
        unit: { type: ["string", "null"] }
        flag: { type: ["string", "null"], description: "N (normal), H (high), L (low), A (abnormal)" }
        refRange: { type: ["string", "null"] }
        comment: { type: ["string", "null"] }
    LabRefByAgeSex:
      type: object
      required: [sex, low, high]
      properties:
        minAgeYears: { type: ["integer", "null"] }
        maxAgeYears: { type: ["integer", "null"] }
        sex: { type: string, enum: [M, F, A] }
        low: { type: number }
        high: { type: number }
    LabCatalogParam:
      type: object
      required: [name]
      properties:
        name: { type: string }
        unit: { type: ["string", "null"] }
        refLow: { type: ["number", "null"] }
        refHigh: { type: ["number", "null"] }
        refText: { type: ["string", "null"] }
        refByAgeSex:
          type: array
          items: { $ref: "#/components/schemas/LabRefByAgeSex" }
    LabCatalogItem:
      type: object
      required: [id, code, name, sampleType, price, gstRate, turnaroundHours, active, createdAt]
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        category: { type: ["string", "null"] }
        sampleType: { type: string }
        container: { type: ["string", "null"] }
        price: { type: number }
        gstRate: { type: number }
        hsn: { type: ["string", "null"] }
        turnaroundHours: { type: integer }
        parameters:
          type: array
          items: { $ref: "#/components/schemas/LabCatalogParam" }
        active: { type: boolean }
        createdAt: { type: string }
    LabCatalogInput:
      type: object
      required: [code, name, sampleType]
      properties:
        code: { type: string }
        name: { type: string }
        category: { type: string }
        sampleType: { type: string }
        container: { type: string }
        price: { type: number }
        gstRate: { type: number }
        hsn: { type: string }
        turnaroundHours: { type: integer }
        parameters:
          type: array
          items: { $ref: "#/components/schemas/LabCatalogParam" }
        active: { type: boolean }
    LabOrder:
      type: object
      required: [id, patientId, patientName, testName, status, priority, createdAt]
      properties:
        id: { type: integer }
        patientId: { type: integer }
        patientName: { type: string }
        patientAge: { type: ["integer", "null"] }
        patientSex: { type: ["string", "null"] }
        catalogId: { type: ["integer", "null"] }
        testName: { type: string }
        category: { type: ["string", "null"] }
        priority: { type: string }
        status: { type: string }
        result: { type: ["string", "null"] }
        normalRange: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        orderedBy: { type: ["string", "null"] }
        billId: { type: ["integer", "null"] }
        sampleId: { type: ["string", "null"] }
        barcode: { type: ["string", "null"] }
        collectedBy: { type: ["string", "null"] }
        collectedAt: { type: ["string", "null"] }
        rejectionReason: { type: ["string", "null"] }
        results:
          type: array
          items: { $ref: "#/components/schemas/LabResultParam" }
        attachmentUrl: { type: ["string", "null"] }
        verifiedBy: { type: ["string", "null"] }
        verifiedAt: { type: ["string", "null"] }
        reportPdfUrl: { type: ["string", "null"] }
        dispatchedAt: { type: ["string", "null"] }
        dispatchedVia: { type: ["string", "null"] }
        patientAcknowledgedAt: { type: ["string", "null"] }
        createdAt: { type: string }
        completedAt: { type: ["string", "null"] }
    LabOrderInput:
      type: object
      required: [patientId]
      properties:
        patientId: { type: integer }
        catalogId: { type: integer }
        testName: { type: string }
        category: { type: string }
        priority: { type: string, enum: [routine, urgent, stat] }
        orderedBy: { type: string }
        autoBill: { type: boolean, description: "If true and catalogId set, auto-create a bill line for this order" }
    CollectLabSampleInput:
      type: object
      properties:
        collectedBy: { type: string }
        sampleId: { type: string }
        barcode: { type: string }
    RejectLabSampleInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
    LabResultInput:
      type: object
      properties:
        result: { type: string, description: "Legacy free-text result; prefer 'results' parameter grid" }
        normalRange: { type: string }
        notes: { type: string }
        results:
          type: array
          items: { $ref: "#/components/schemas/LabResultParam" }
        attachmentUrl: { type: string }
    VerifyLabResultInput:
      type: object
      required: [verifiedBy]
      properties:
        verifiedBy: { type: string }
    DispatchInput:
      type: object
      properties:
        via: { type: string, enum: [sms, whatsapp, email, both, none] }

    Prescription:
      type: object
      required: [id, patientId, patientName, drug, dosage, status, createdAt]
      properties:
        id: { type: integer }
