openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: MediCare HMS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: dashboard
  - name: patients
  - name: appointments
  - name: encounters
  - name: beds
  - name: admissions
  - name: ipd
  - name: lab
  - name: prescriptions
  - name: pharmacy
  - name: billing
  - name: inventory
  - name: staff
  - name: vitals
  - name: radiology
  - name: ot
  - name: vaccinations
  - name: consent
  - name: checkups
  - name: roster
  - name: queue
  - name: videos
  - name: notifications
  - name: templates
  - name: audit
  - name: Storage
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "204": { description: Logged out }
  /auth/me:
    get:
      operationId: me
      tags: [auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }
  /dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityItem" }
  /dashboard/charts:
    get:
      operationId: getDashboardCharts
      tags: [dashboard]
      responses:
        "200":
          description: Chart data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardCharts" }

  /patients:
    get:
      operationId: listPatients
      tags: [patients]
      parameters:
        - { in: query, name: search, schema: { type: string } }
      responses:
        "200":
          description: Patients
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Patient" }
    post:
      operationId: createPatient
      tags: [patients]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatientInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Patient" }
  /patients/{id}:
    get:
      operationId: getPatient
      tags: [patients]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Patient
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Patient" }
    patch:
      operationId: updatePatient
      tags: [patients]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatientUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Patient" }
    delete:
      operationId: deletePatient
      tags: [patients]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }

  /appointments:
    get:
      operationId: listAppointments
      tags: [appointments]
      parameters:
        - { in: query, name: patientId, schema: { type: integer } }
        - { in: query, name: doctorId, schema: { type: integer } }
        - { in: query, name: department, schema: { type: string } }
        - { in: query, name: date, schema: { type: string } }
        - { in: query, name: status, schema: { type: string } }
      responses:
        "200":
          description: Appointments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Appointment" }
    post:
      operationId: createAppointment
      tags: [appointments]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppointmentInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
  /appointments/{id}:
    patch:
      operationId: updateAppointment
      tags: [appointments]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppointmentUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
    delete:
      operationId: cancelAppointment
      tags: [appointments]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "204": { description: Cancelled }

  /encounters:
    get:
      operationId: listEncounters
      tags: [encounters]
      parameters:
        - { in: query, name: patientId, schema: { type: integer } }
        - { in: query, name: type, schema: { type: string } }
      responses:
        "200":
          description: Encounters
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Encounter" }
    post:
      operationId: createEncounter
      tags: [encounters]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EncounterInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Encounter" }
  /encounters/{id}:
    get:
      operationId: getEncounter
      tags: [encounters]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Encounter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Encounter" }
    patch:
      operationId: updateEncounter
      tags: [encounters]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EncounterUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Encounter" }

  /beds:
    get:
      operationId: listBeds
      tags: [beds]
      responses:
        "200":
          description: Beds
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Bed" }
    post:
      operationId: createBed
      tags: [beds]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BedInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bed" }
  /beds/{id}/assign:
    post:
      operationId: assignBed
      tags: [beds]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BedAssignmentInput" }
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bed" }
  /beds/{id}/discharge:
    post:
      operationId: dischargeBed
      tags: [beds]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Discharged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bed" }
  /beds/{id}/status:
    post:
      operationId: updateBedStatus
      tags: [beds]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BedStatusInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bed" }

  /admissions:
    get:
      operationId: listAdmissions
      tags: [admissions]
      parameters:
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: patientId, schema: { type: integer } }
        - { in: query, name: ward, schema: { type: string } }
      responses:
        "200":
          description: Admissions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Admission" }
    post:
      operationId: createAdmission
      tags: [admissions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdmissionInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Admission" }
  /admissions/{id}:
    get:
      operationId: getAdmission
      tags: [admissions]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Admission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Admission" }
  /admissions/{id}/transfer:
    post:
      operationId: transferAdmission
      tags: [admissions]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdmissionTransferInput" }
      responses:
        "200":
          description: Transferred
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Admission" }
  /admissions/{id}/discharge:
    post:
      operationId: dischargeAdmission
      tags: [admissions]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdmissionDischargeInput" }
      responses:
        "200":
          description: Discharged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdmissionDischarge" }
  /admissions/{id}/rounds:
    get:
      operationId: listWardRounds
      tags: [admissions]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Rounds
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WardRound" }
    post:
      operationId: createWardRound
      tags: [admissions]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WardRoundInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WardRound" }
  /admissions/{id}/nursing-notes:
    get:
      operationId: listNursingNotes
      tags: [admissions]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Nursing notes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NursingNote" }
    post:
      operationId: createNursingNote
      tags: [admissions]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NursingNoteInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NursingNote" }
  /admissions/{id}/mar:
    get:
      operationId: listMar
      tags: [admissions]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: MAR
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MarEntry" }
    post:
      operationId: recordMarDose
      tags: [admissions]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarDoseInput" }
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarEntry" }

  /ipd/census:
    get:
      operationId: getIpdCensus
      tags: [ipd]
      responses:
        "200":
          description: Census
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IpdCensus" }

  /lab/orders:
    get:
      operationId: listLabOrders
      tags: [lab]
      parameters:
        - { in: query, name: patientId, schema: { type: integer } }
        - { in: query, name: status, schema: { type: string } }
      responses:
        "200":
          description: Lab orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LabOrder" }
    post:
      operationId: createLabOrder
      tags: [lab]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LabOrderInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LabOrder" }
  /lab/orders/{id}/result:
    post:
      operationId: recordLabResult
      tags: [lab]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LabResultInput" }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LabOrder" }
  /lab/orders/{id}/collect:
    post:
      operationId: collectLabSample
      tags: [lab]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectLabSampleInput" }
      responses:
        "200": { description: Collected, content: { application/json: { schema: { $ref: "#/components/schemas/LabOrder" } } } }
  /lab/orders/{id}/reject:
    post:
      operationId: rejectLabSample
      tags: [lab]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RejectLabSampleInput" }
      responses:
        "200": { description: Rejected, content: { application/json: { schema: { $ref: "#/components/schemas/LabOrder" } } } }
  /lab/orders/{id}/verify:
    post:
      operationId: verifyLabResult
      tags: [lab]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyLabResultInput" }
      responses:
        "200": { description: Verified, content: { application/json: { schema: { $ref: "#/components/schemas/LabOrder" } } } }
  /lab/orders/{id}/dispatch:
    post:
      operationId: dispatchLabReport
      tags: [lab]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DispatchInput" }
      responses:
        "200": { description: Dispatched, content: { application/json: { schema: { $ref: "#/components/schemas/LabOrder" } } } }
  /lab/catalog:
    get:
      operationId: listLabCatalog
      tags: [lab]
      responses:
        "200": { description: Items, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/LabCatalogItem" } } } } }
    post:
      operationId: createLabCatalogItem
      tags: [lab]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LabCatalogInput" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/LabCatalogItem" } } } }
  /lab/catalog/{id}:
    patch:
      operationId: updateLabCatalogItem
      tags: [lab]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LabCatalogInput" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/LabCatalogItem" } } } }
  /pdf/lab-report/{id}:
    get:
      operationId: getLabReportPdf
      tags: [lab]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200": { description: PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }

  /prescriptions:
    get:
      operationId: listPrescriptions
      tags: [prescriptions]
      parameters:
        - { in: query, name: patientId, schema: { type: integer } }
        - { in: query, name: status, schema: { type: string } }
      responses:
        "200":
          description: Prescriptions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Prescription" }
    post:
      operationId: createPrescription
      tags: [prescriptions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrescriptionInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Prescription" }
  /prescriptions/{id}/dispense:
    post:
      operationId: dispensePrescription
      tags: [pharmacy]
      deprecated: true
      description: "Deprecated. Use POST /pharmacy/sales which creates a sale, decrements batch stock (FEFO), posts a bill, and marks the prescription dispensed atomically."
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: No-op acknowledgement (deprecated)
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }

  /pharmacy/queue:
    get:
      operationId: getPharmacyQueue
      tags: [pharmacy]
      responses:
        "200":
          description: Queue
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Prescription" }
  /drugs:
    get:
      operationId: listDrugs
      tags: [pharmacy]
      responses:
        "200":
          description: Drug library
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Drug" }
    post:
      operationId: createDrug
      tags: [pharmacy]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DrugInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Drug" }
  /drugs/{id}:
    patch:
      operationId: updateDrug
      tags: [pharmacy]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DrugInput" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Drug" } } } }
    delete:
      operationId: deleteDrug
      tags: [pharmacy]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200": { description: Deleted, content: { application/json: { schema: { type: object, required: [ok], properties: { ok: { type: boolean } } } } } }
        "409": { description: Referenced and cannot be deleted }
  /pharmacy/drugs/{id}/batches:
    get:
      operationId: listDrugBatches
      tags: [pharmacy]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Batches, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PharmacyBatch" } } } } }
  /pharmacy/batches:
    get:
      operationId: listAllBatches
      tags: [pharmacy]
      parameters:
        - { in: query, name: nearExpiryDays, schema: { type: integer } }
      responses:
        "200": { description: All batches, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PharmacyBatch" } } } } }
  /pharmacy/alerts:
    get:
      operationId: getPharmacyAlerts
      tags: [pharmacy]
      responses:
        "200": { description: Alerts, content: { application/json: { schema: { $ref: "#/components/schemas/PharmacyAlerts" } } } }
  /pharmacy/suppliers:
    get:
      operationId: listSuppliers
      tags: [pharmacy]
      responses:
        "200": { description: Suppliers, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PharmacySupplier" } } } } }
    post:
      operationId: createSupplier
      tags: [pharmacy]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PharmacySupplierInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/PharmacySupplier" } } } }
  /pharmacy/purchase-orders:
    get:
      operationId: listPurchaseOrders
      tags: [pharmacy]
      responses:
        "200": { description: POs, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PurchaseOrder" } } } } }
    post:
      operationId: createPurchaseOrder
      tags: [pharmacy]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PurchaseOrderInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/PurchaseOrder" } } } }
  /pharmacy/purchase-orders/{id}:
    get:
      operationId: getPurchaseOrder
      tags: [pharmacy]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200": { description: PO, content: { application/json: { schema: { $ref: "#/components/schemas/PurchaseOrder" } } } }
  /pharmacy/grns:
    get:
      operationId: listGrns
      tags: [pharmacy]
      responses:
        "200": { description: GRNs, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Grn" } } } } }
    post:
